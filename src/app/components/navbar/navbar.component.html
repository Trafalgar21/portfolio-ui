<header class="nav" [class.nav--scrolled]="isScrolled()">
  <div class="nav__inner">
    <a class="nav__mark mono" href="#top">ludwig.dev</a>

    <nav class="nav__links">
      @for (link of links; track link.href) {
        <a class="mono" [href]="link.href">./{{ link.label }}</a>
      }
    </nav>

    <div class="nav__actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
          </svg>
        }
      </button>

      <button
        class="nav__toggle"
        type="button"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle menu"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav class="nav__mobile">
      @for (link of links; track link.href) {
        <a class="mono" [href]="link.href" (click)="closeMenu()">./{{ link.label }}</a>
      }
    </nav>
  }
</header>
