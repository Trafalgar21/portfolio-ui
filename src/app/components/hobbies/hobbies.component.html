<section id="hobbies" class="hobbies">
  <div class="wrap">
    <h2 class="section-heading"><span class="section-heading__index mono">04</span> Outside of work</h2>
    <p class="section-lede">A few of the things that keep me off a screen, or at least off this kind of screen.</p>

    <div class="hobbies__grid">
      @for (hobby of hobbies; track hobby.name) {
        <div class="hobby">
          <h3 class="hobby__name">{{ hobby.name }}</h3>
          <p class="hobby__description">{{ hobby.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
